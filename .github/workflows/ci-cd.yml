name: CI/CD Pipeline automated build docker & deploy by Auroraphtgrp01

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: auroraphtgrp/go-dump-postgres:latest

      - name: CI/CD Workflow Info
        run: |
          echo "CI/CD Workflow by Minh Tuan Le (auroraphtgrp01)"
          echo "Multi-architecture build completed successfully!"
          echo "Supported architectures: amd64, arm64"